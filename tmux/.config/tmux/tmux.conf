set -g default-terminal "${TERM}"
set -g terminal-overrides ',xterm-256color:RGB'

set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g mouse on
setw -g mode-keys vi
set -g status-position bottom

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind H resize-pane -L 5
bind J resize-pane -D 5
bind K resize-pane -U 5
bind L resize-pane -R 5

bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

bind z resize-pane -Z

bind 0 select-window -t 10
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

bind c new-window -c "#{pane_current_path}"
bind Tab next-window
bind , display-menu -T "Rename" -x C -y C "Window" W { display-popup -w 50 -h 3 -E "read \"name?Window name: \"; tmux rename-window -- \"\$name\"" } "Session" S { display-popup -w 50 -h 3 -E "read \"name?Session name: \"; tmux rename-session -- \"\$name\"" }
bind S choose-tree -Zs
bind C display-popup -w 50 -h 3 -E "read \"name?Session name: \"; tmux new-session -d -s \"\$name\" && tmux switch-client -t \"\$name\""
bind ( switch-client -p
bind ) switch-client -n
bind d detach-client

bind q kill-pane
bind x kill-pane

bind r source-file ~/.config/tmux/tmux.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'omerxx/catppuccin-tmux'

set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

set -g @catppuccin_flavour 'mocha'

set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag, ,}"

set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "directory"
set -g @catppuccin_directory_text "#{b:pane_current_path}"

set -g @catppuccin_status_left_separator "  "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"

run '~/.config/tmux/plugins/tpm/tpm'

set -g message-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g message-command-style 'fg=#cdd6f4,bg=#1e1e2e'
