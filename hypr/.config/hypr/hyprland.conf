# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

################
### MONITORS ###
################

monitor=,preferred,auto,auto


###################
### MY PROGRAMS ###
###################


# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$browser = zen-browser


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

exec-once = waybar  
exec-once = swww-daemon
exec-once = nm-applet --indicator &
exec-once = blueman-applet &
exec-once = swaync

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

general {

    border_size = 1
    gaps_in = 3
    gaps_out = 8

    #TODO: make a way to change colors based ont the current theme
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle

    resize_on_border = true
    hover_icon_on_border = true

    allow_tearing = false

}

decoration {
    rounding = 15
    rounding_power = 4

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 7
        passes = 3

        new_optimizations = true

        contrast = 2
        vibrancy = 1
        noise = 0.2

    }

    shadow {
        enabled = true
        range = 5
        render_power = 6
        color = rgba(1a1a1aff)
    }

}

animations {
    enabled = yes, please :)

        bezier = default, 0.05, 0.9, 0.1, 1.05
        bezier = wind, 0.05, 0.9, 0.1, 1.05
        bezier = overshot, 0.13, 0.99, 0.29, 1.08
        bezier = liner, 1, 1, 1, 1
        bezier = bounce, 0.4, 0.9, 0.6, 1.0
        bezier = snappyReturn, 0.4, 0.9, 0.6, 1.0

        bezier = slideInFromRight, 0.5, 0.0, 0.5, 1.0

        animation = windows, 1, 5,  snappyReturn, slidevert
        animation = windowsIn, 1, 5, snappyReturn, slidevert right 

        animation = windowsOut, 1, 4, snappyReturn, slide 
        animation = windowsMove, 1, 4, wind, slide
        animation = layers, 1, 4, bounce, popin 50%
        animation = layersOut, 1, 5, bounce, fade
        animation = fadeIn, 1, 10, default
        animation = fadeOut, 1, 10, default
        animation = fadeSwitch, 1, 10, default
        animation = fadeShadow, 1, 10, default
        animation = fadeDim, 1, 10, default
        animation = fadeLayers, 1, 10, default
        animation = workspaces, 1, 7, overshot, slide
        animation = border, 1, 1, liner
        animation = borderangle, 1, 30, liner, once
}

group {
    insert_after_current = true
    focus_removed_window = true
    
    groupbar{
        enabled = false
    }

}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

input {
    kb_layout = us,br
    kb_variant =,abnt2
    kb_model =
    kb_options =
    kb_rules =

    numlock_by_default = false

    sensitivity = 0.2
    accel_profile = adaptive

    follow_mouse = 1

    touchpad {
        tap-to-click = true
        natural_scroll = false
    }
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

binds {
    workspace_center_on = 1 #Put the mouse on the last focused window when switching workspaces
    movefocus_cycles_fullscreen = true #When moving focus, cycle through fullscreen windows as well
}

cursor {
    sync_gsettings_theme = true # Syncs cursor theme with gsettings (GNOME/KDE/etc)
    inactive_timeout = 3 # Time in seconds to switch to inactive cursor after no movement
    hide_on_key_press = true # Hides cursor when typing
    warp_on_change_workspace = true # Warps cursor to center of screen when changing workspaces
    persistent_warps = true # Remembers cursor position on each monitor when switching
}

###################
### KEYBINDINGS ###
###################

$scrPath = ~/.local/share/scripts
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod, Q, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, W, togglefloating,
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, G, togglegroup,
bind = $mainMod SHIFT, F, exec, hyprctl dispatch togglefloating active && hyprctl dispatch pin active #Pin a window
bind = Alt, Return, fullscreen,

#Applications Shortcuts
bind = $mainMod, T, exec, $terminal
bind = $mainMod, F, exec, $browser
bind = $mainMod, E, exec, $fileManager

#Custom Scripts
bind = $mainMod SHIFT, W, exec, $scrPath/wallpaperswitcher.sh
bind = $mainMod SHIFT, T, exec, $scrPath/themeswitcher.sh
bind = $mainMod, A, exec, $scrPath/rofi_launcher.sh || pkill -x rofi
bind = $mainMod, P, exec, $scrPath/screenshot.sh
bind = $mainMod SHIFT, K, exec, $scrPath/keyboardswitch.sh 

# Move focus with mainMod + arrow key
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

#Swap Windows
bind = $mainMod ALT, H, swapwindow, l
bind = $mainMod ALT, L, swapwindow, r
bind = $mainMod ALT, K, swapwindow, u
bind = $mainMod ALT, J, swapwindow, d

#Resize Mode

bind = $mainMod, R, submap, resize

submap = resize

binde = , l, resizeactive, 30 0
binde = , h, resizeactive, -30 0
binde = , k, resizeactive, 0 -30
binde = , j, resizeactive, 0 30

bind = , escape, submap, reset
bind = , return, submap, reset

submap = reset

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

#Move active window to a workspace silent
bind = $mainMod Alt, 1, movetoworkspacesilent, 1
bind = $mainMod Alt, 2, movetoworkspacesilent, 2
bind = $mainMod Alt, 3, movetoworkspacesilent, 3
bind = $mainMod Alt, 4, movetoworkspacesilent, 4
bind = $mainMod Alt, 5, movetoworkspacesilent, 5
bind = $mainMod Alt, 6, movetoworkspacesilent, 6
bind = $mainMod Alt, 7, movetoworkspacesilent, 7
bind = $mainMod Alt, 8, movetoworkspacesilent, 8
bind = $mainMod Alt, 9, movetoworkspacesilent, 9
bind = $mainMod Alt, 0, movetoworkspacesilent, 10

# special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod+Alt, S, movetoworkspace, special

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}
