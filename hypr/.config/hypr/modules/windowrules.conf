##############################
### WINDOWS AND WORKSPACES ###
##############################

# Example windowrules that are useful

windowrule {
    # Ignore maximize requests from all apps. You'll probably like this.
    name = suppress-maximize-events
    match:class = .*

    suppress_event = maximize
}

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

#Kitty
windowrule = opacity 0.98 0.98, match:class kitty

#Blethoot manager
windowrule = float on, match:title overskride

#Audio Control
windowrule = float on, match:class org.pulseaudio.pavucontrol
windowrule = size 923 644, match:class org.pulseaudio.pavucontrol

#Blur Waybar
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.5

#Blur swaync
layerrule = match:namespace swaync-control-center, blur on
layerrule = match:namespace swaync-notification-window, blur on


layerrule = match:namespace swaync-control-center, ignore_alpha 0.5
layerrule = match:namespace swaync-notification-window, ignore_alpha 0.5

#Blur wlogout
layerrule = match:namespace logout_dialog, blur on
layerrule = match:namespace logout_dialog, animation fade

#Blur rofi
layerrule = match:namespace rofi, blur on
