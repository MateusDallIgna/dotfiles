#####################
### LOOK AND FEEL ###
#####################

general {

    border_size = 1
    gaps_in = 3
    gaps_out = 8

    #TODO: make a way to change colors based ont the current theme
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    #dwindle scrolling master
    layout = scrolling

    resize_on_border = false
    hover_icon_on_border = true

    allow_tearing = false

}

decoration {
    rounding = 15
    rounding_power = 4

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 4

        new_optimizations = true

        contrast = 2
        vibrancy = 1
        noise = 0.0

    }

    shadow {
        enabled = true
        range = 5
        render_power = 6
        color = rgba(1a1a1aff)
    }

}
